global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  # The model service: HTTP, model outputs, drift, accuracy, and its own CPU/RAM.
  - job_name: vit-api
    static_configs:
      - targets: ["api:8000"]

  # Host: CPU, memory, disk, network of the machine (or Docker VM) running the stack.
  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]

  # Per-container CPU, memory, network and restarts.
  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
