name: CI

# Runs on pushes to the two long-lived branches and on pull requests into main.
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  IMAGE_NAME: vit-lora-api

jobs:
  # Every trigger: unit + API tests against a tiny randomly-initialised ViT.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-*.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Run tests
        run: python -m pytest tests -v

  # Every trigger, after tests pass: make sure the inference image builds.
  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t $IMAGE_NAME:${{ github.sha }} .
      - name: Check the app imports inside the image
        run: docker run --rm $IMAGE_NAME:${{ github.sha }} python -c "import app.main; print('image OK')"
      - name: Validate Prometheus config and alert rules
        run: |
          docker run --rm -v "$PWD/observability/prometheus:/etc/prometheus" --entrypoint promtool \
            prom/prometheus:v3.5.0 check config /etc/prometheus/prometheus.yml
      - name: Check the Grafana dashboard matches its generator
        run: |
          python3 observability/grafana/make_dashboard.py
          git diff --exit-code observability/grafana/dashboards

  # Only on pushes to main: publish the image to GitHub Container Registry.
  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
      - name: Build and push
        run: |
          IMAGE=ghcr.io/$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')/$IMAGE_NAME
          docker build -t $IMAGE:latest -t $IMAGE:${{ github.sha }} .
          docker push --all-tags $IMAGE
